<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | DROP SKATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Bloqueio de acesso imediato (Simulação de Spring Security Filter)
        if(localStorage.getItem('drop_user_role') !== 'ADMIN') {
            window.location.href = 'login.html';
        }

        tailwind.config = { theme: { extend: { colors: { brand: { dark: '#0a0a0c', card: '#121216', border: '#22222a', neon: '#00ff88', cyan: '#00e5ff', accent: '#ff0055' } }, fontFamily: { display: ['Syne', 'sans-serif'], sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen p-6">

<header class="max-w-7xl mx-auto flex justify-between items-center mb-8 bg-brand-card p-5 rounded-2xl border border-brand-border">
    <div class="flex items-center gap-3">
        <span class="w-3 h-3 bg-brand-neon rounded-full animate-pulse"></span>
        <h1 class="font-display text-2xl font-bold uppercase text-white">Admin Dashboard</h1>
    </div>
    <div class="flex gap-3">
        <button onclick="openAddProductModal()" class="px-4 py-2 bg-brand-neon text-black text-xs font-bold rounded-lg"><i class="fa-solid fa-plus"></i> Produto</button>
        <a href="index.html" class="px-4 py-2 bg-brand-border text-white text-xs font-bold rounded-lg"><i class="fa-solid fa-store"></i> Ver Loja</a>
        <button onclick="logout()" class="px-4 py-2 text-brand-accent text-xs font-bold rounded-lg hover:bg-brand-border"><i class="fa-solid fa-power-off"></i> Sair</button>
    </div>
</header>

<main class="max-w-7xl mx-auto space-y-6">
    <!-- Métricas -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-brand-card p-4 rounded-xl border border-brand-border"><span class="text-xs text-gray-400">Total Produtos</span><div class="text-2xl font-bold" id="statProductsCount">0</div></div>
        <div class="bg-brand-card p-4 rounded-xl border border-brand-border"><span class="text-xs text-gray-400">Estoque Baixo</span><div class="text-2xl font-bold text-brand-accent" id="statLowStock">0</div></div>
        <div class="bg-brand-card p-4 rounded-xl border border-brand-border"><span class="text-xs text-gray-400">Pedidos Hoje</span><div class="text-2xl font-bold text-brand-cyan">14</div></div>
        <div class="bg-brand-card p-4 rounded-xl border border-brand-border"><span class="text-xs text-gray-400">Faturamento</span><div class="text-2xl font-bold text-brand-neon">R$ 4.250,00</div></div>
    </div>

    <!-- Tabela -->
    <div class="bg-brand-card rounded-2xl border border-brand-border overflow-hidden p-5">
        <input type="text" id="adminSearchInput" onkeyup="filterAdminTable()" placeholder="Buscar ID ou Nome..." class="w-64 bg-brand-dark border border-brand-border rounded-lg py-2 px-3 text-xs mb-4 text-white">
        <table class="w-full text-left text-xs">
            <thead class="bg-brand-dark text-gray-400 border-b border-brand-border">
            <tr><th class="p-3">Item</th><th class="p-3">Categoria</th><th class="p-3">Preço</th><th class="p-3">Estoque</th><th class="p-3">Ação</th></tr>
            </thead>
            <tbody id="adminProductTable" class="divide-y divide-brand-border/60"></tbody>
        </table>
    </div>
</main>

<!-- Modal Admin Simplificado -->
<div id="adminProductModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <div class="bg-brand-card p-6 rounded-2xl w-full max-w-md border border-brand-border">
        <h3 id="adminModalTitle" class="font-bold text-white mb-4">Adicionar Produto</h3>
        <form id="productForm" onsubmit="handleProductFormSubmit(event)" class="space-y-3 text-xs">
            <input type="hidden" id="formProductId">
            <input type="text" id="formTitle" placeholder="Nome do Produto" required class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white">
            <select id="formCategory" class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white">
                <option value="decks">Shapes</option><option value="trucks">Trucks</option>
                <option value="wheels">Rodas/Rolamentos</option><option value="shoes">Tênis</option><option value="apparel">Vestuário</option>
            </select>
            <div class="flex gap-2">
                <input type="number" step="0.01" id="formPrice" placeholder="Preço" required class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white">
                <input type="number" id="formStock" placeholder="Estoque" required class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white">
            </div>
            <input type="url" id="formImage" placeholder="URL da Imagem" required class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white">
            <textarea id="formDescription" placeholder="Descrição" required class="w-full p-2 bg-brand-dark border border-brand-border rounded text-white"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" onclick="closeAdminProductModal()" class="px-4 py-2 bg-brand-border rounded text-white">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-brand-neon text-black font-bold rounded">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Container do Toast -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

<script src="js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        renderAdminTable();
        updateAdminMetrics();
    });
</script>
</body>
</html>
